<svg xmlns="http://www.w3.org/2000/svg" viewBox="-6.596 -8.05 14.75 14.75" width="96" height="96" class="iso-icon" data-icon="book-stack" data-mode="loop" stroke-linejoin="round" stroke-linecap="round" role="img" aria-label="Book stack"><style>.iso-g{transform-box:fill-box;transform-origin:50% 50%}.iso-ob{transform-origin:50% 100%}.iso-ot{transform-origin:50% 0}.iso-paused *{animation-play-state:paused!important}.iso-click{cursor:pointer}.iso-click .iso-g,.iso-click [class^="iso-"],.iso-click [class*=" iso-"]{animation:none!important;transition:transform .5s cubic-bezier(.34,1.35,.64,1),opacity .35s ease}.iso-click .iso-pop{transform:scale(0);opacity:0}.iso-click.iso-on .iso-pop{transform:scale(1);opacity:1}.iso-click .iso-fade{opacity:0}.iso-click.iso-on .iso-fade{opacity:1}.iso-click .iso-dash{opacity:0}.iso-click.iso-on .iso-dash{opacity:1;transform:translate(var(--dx,-2.6px),var(--dy,-1.5px))}.iso-click .iso-drop{transform:translateY(var(--from,-9px))}.iso-click.iso-on .iso-drop{transform:none}.iso-click .iso-pulse{opacity:.3}.iso-click.iso-on .iso-pulse{opacity:1}.iso-click.iso-on .iso-float{transform:translateY(var(--amp,-.8px))}.iso-click.iso-on .iso-shadow{transform:scale(.8);opacity:.5}.iso-click.iso-on .iso-blink{opacity:.15}.iso-click.iso-on .iso-rise{transform:translateY(var(--rise,-6px))}.iso-click.iso-on .iso-flicker{transform:scaleY(1.3)}@keyframes iso-float{0%,100%{transform:translateY(0)}50%{transform:translateY(var(--amp,-.8px))}}@keyframes iso-shadow{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.8);opacity:.5}}@keyframes iso-blink{0%,100%{opacity:1}50%{opacity:.12}}@keyframes iso-pulse{0%,100%{opacity:.2}50%{opacity:1}}@keyframes iso-pop{0%,6%{transform:scale(0);opacity:0}16%{transform:scale(1.12);opacity:1}24%{transform:scale(1)}72%{transform:scale(1);opacity:1}84%,100%{transform:scale(0);opacity:0}}@keyframes iso-drop{0%{transform:translateY(var(--from,-9px));opacity:0}10%{opacity:1}48%{transform:translateY(0)}62%{transform:translateY(-.9px)}76%,100%{transform:translateY(0)}}@keyframes iso-rise{0%{transform:translateY(1.5px);opacity:0}25%{opacity:1}75%{opacity:1}100%{transform:translateY(var(--rise,-6px));opacity:0}}@keyframes iso-fade{0%{opacity:0}15%{opacity:1}80%{opacity:1}100%{opacity:0}}@keyframes iso-flicker{0%,100%{transform:scaleY(1)}30%{transform:scaleY(.7)}60%{transform:scaleY(1.18)}80%{transform:scaleY(.85)}}@keyframes iso-dash{0%{transform:translate(0,0);opacity:0}30%{opacity:1}100%{transform:translate(var(--dx,-2.6px),var(--dy,-1.5px));opacity:0}}.iso-float{animation:iso-float var(--dur,3s) ease-in-out infinite}.iso-shadow{animation:iso-shadow var(--dur,3s) ease-in-out infinite}.iso-blink{animation:iso-blink var(--dur,1.4s) ease-in-out infinite}.iso-pulse{animation:iso-pulse var(--dur,2s) ease-in-out infinite}.iso-pop{animation:iso-pop var(--dur,4s) cubic-bezier(.34,1.56,.64,1) infinite}.iso-drop{animation:iso-drop var(--dur,2.8s) cubic-bezier(.5,0,.8,.4) infinite}.iso-rise{animation:iso-rise var(--dur,2.4s) ease-out infinite}.iso-fade{animation:iso-fade var(--dur,3s) ease-in-out infinite}.iso-flicker{animation:iso-flicker var(--dur,.35s) ease-in-out infinite}.iso-dash{animation:iso-dash var(--dur,1.2s) ease-out infinite}</style><polygon points="-3.984,2.3 1.559,5.5 1.559,4.6 -3.984,1.4" fill="#ba5372" stroke="#3b4a41" stroke-width="0.23"></polygon><polygon points="5.543,3.2 1.559,5.5 1.559,4.6 5.543,2.3" fill="#e8688e" stroke="#3b4a41" stroke-width="0.23"></polygon><polygon points="0,-0.9 5.543,2.3 1.559,4.6 -3.984,1.4" fill="#ef95b0" stroke="#3b4a41" stroke-width="0.23"></polygon><polygon points="5.335,3.18 1.784,5.23 1.784,4.63 5.335,2.58" fill="#6da284" stroke="#3b4a41" stroke-width="0.23"></polygon><polygon points="-3.126,2.705 -2.693,2.955 -2.693,2.255 -3.126,2.005" fill="#752f7a" stroke="#3b4a41" stroke-width="0.23"></polygon><polygon points="-3.464,1.6 1.386,4.4 1.386,3.6 -3.464,0.8" fill="#26623f" stroke="#3b4a41" stroke-width="0.23"></polygon><polygon points="5.023,2.3 1.