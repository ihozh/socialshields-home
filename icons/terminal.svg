<svg xmlns="http://www.w3.org/2000/svg" viewBox="-3.424 -7.6 13.95 13.95" width="96" height="96" class="iso-icon" data-icon="terminal" data-mode="loop" stroke-linejoin="round" stroke-linecap="round" role="img" aria-label="Terminal"><style>.iso-g{transform-box:fill-box;transform-origin:50% 50%}.iso-ob{transform-origin:50% 100%}.iso-ot{transform-origin:50% 0}.iso-paused *{animation-play-state:paused!important}.iso-click{cursor:pointer}.iso-click .iso-g,.iso-click [class^="iso-"],.iso-click [class*=" iso-"]{animation:none!important;transition:transform .5s cubic-bezier(.34,1.35,.64,1),opacity .35s ease}.iso-click .iso-pop{transform:scale(0);opacity:0}.iso-click.iso-on .iso-pop{transform:scale(1);opacity:1}.iso-click .iso-fade{opacity:0}.iso-click.iso-on .iso-fade{opacity:1}.iso-click .iso-dash{opacity:0}.iso-click.iso-on .iso-dash{opacity:1;transform:translate(var(--dx,-2.6px),var(--dy,-1.5px))}.iso-click .iso-drop{transform:translateY(var(--from,-9px))}.iso-click.iso-on .iso-drop{transform:none}.iso-click .iso-pulse{opacity:.3}.iso-click.iso-on .iso-pulse{opacity:1}.iso-click.iso-on .iso-float{transform:translateY(var(--amp,-.8px))}.iso-click.iso-on .iso-shadow{transform:scale(.8);opacity:.5}.iso-click.iso-on .iso-blink{opacity:.15}.iso-click.iso-on .iso-rise{transform:translateY(var(--rise,-6px))}.iso-click.iso-on .iso-flicker{transform:scaleY(1.3)}@keyframes iso-float{0%,100%{transform:translateY(0)}50%{transform:translateY(var(--amp,-.8px))}}@keyframes iso-shadow{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.8);opacity:.5}}@keyframes iso-blink{0%,100%{opacity:1}50%{opacity:.12}}@keyframes iso-pulse{0%,100%{opacity:.2}50%{opacity:1}}@keyframes iso-pop{0%,6%{transform:scale(0);opacity:0}16%{transform:scale(1.12);opacity:1}24%{transform:scale(1)}72%{transform:scale(1);opacity:1}84%,100%{transform:scale(0);opacity:0}}@keyframes iso-drop{0%{transform:translateY(var(--from,-9px));opacity:0}10%{opacity:1}48%{transform:translateY(0)}62%{transform:translateY(-.9px)}76%,100%{transform:translateY(0)}}@keyframes iso-rise{0%{transform:translateY(1.5px);opacity:0}25%{opacity:1}75%{opacity:1}100%{transform:translateY(var(--rise,-6px));opacity:0}}@keyframes iso-fade{0%{opacity:0}15%{opacity:1}80%{opacity:1}100%{opacity:0}}@keyframes iso-flicker{0%,100%{transform:scaleY(1)}30%{transform:scaleY(.7)}60%{transform:scaleY(1.18)}80%{transform:scaleY(.85)}}@keyframes iso-dash{0%{transform:translate(0,0);opacity:0}30%{opacity:1}100%{transform:translate(var(--dx,-2.6px),var(--dy,-1.5px));opacity:0}}.iso-float{animation:iso-float var(--dur,3s) ease-in-out infinite}.iso-shadow{animation:iso-shadow var(--dur,3s) ease-in-out infinite}.iso-blink{animation:iso-blink var(--dur,1.4s) ease-in-out infinite}.iso-pulse{animation:iso-pulse var(--dur,2s) ease-in-out infinite}.iso-pop{animation:iso-pop var(--dur,4s) cubic-bezier(.34,1.56,.64,1) infinite}.iso-drop{animation:iso-drop var(--dur,2.8s) cubic-bezier(.5,0,.8,.4) infinite}.iso-rise{animation:iso-rise var(--dur,2.4s) ease-out infinite}.iso-fade{animation:iso-fade var(--dur,3s) ease-in-out infinite}.iso-flicker{animation:iso-flicker var(--dur,.35s) ease-in-out infinite}.iso-dash{animation:iso-dash var(--dur,1.2s) ease-out infinite}</style><polygon points="-1.126,0.45 7.015,5.15 7.015,4.75 -1.126,0.05" fill="#005045" stroke="#1b1b1b" stroke-width="0.218"></polygon><polygon points="8.227,4.45 7.015,5.15 7.015,4.75 8.227,4.05" fill="#006456" stroke="#1b1b1b" stroke-width="0.218"></polygon><polygon points="0.087,-0.65 8.227,4.05 7.015,4.75 -1.126,0.05" fill="#4d9389" stroke="#1b1b1b" stroke-width="0.218"></polygon><polygon points="-0.433,-0.15 7.361,4.35 7.361,-1.65 -0.433,-6.15" fill="#005045" stroke="#1b1b1b" stroke-width="0.218"></polygon><polygon points="7.794,4.1 7.361,4.35 7.361,-1.65 7.794,-1.9" fill="#006456" stroke="#1b1b1b" stroke-width="0.218"></polygon><polygon points="0,-6.4 7.794,-1.9 7.361,-1.65 -0.433,-6.15" fill="#4d9389" stroke="#1b1b1b" stroke-width="0.218"></polygon><polygon point